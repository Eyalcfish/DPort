name: Build macOS Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x' # Update to your preferred Go version

    - name: Run Tests
      run: bash test.bash

    - name: Build macOS Shared Library
      run: bash all.command

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-dylib
        path: |
          bin/dport.dylib
          bin/dport.h
